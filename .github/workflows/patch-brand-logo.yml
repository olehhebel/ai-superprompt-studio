name: Patch canonical brand logo

on:
  push:
    branches: [index.html]
    paths: [.github/workflows/patch-brand-logo.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: index.html
      - name: Patch logo, favicon and schema
        shell: bash
        run: |
          mkdir -p assets/brand
          cp assets/email-logo-light.svg assets/brand/oleh-hebel-co-logo.svg
          cp assets/email-logo-light.svg favicon.svg
          python <<'PY'
          from pathlib import Path
          import json, re

          ORG_ID='https://superprompt.pro/#organization'
          LOGO_URL='https://superprompt.pro/assets/brand/oleh-hebel-co-logo.svg'
          LOGO={'@type':'ImageObject','@id':'https://superprompt.pro/#logo','url':LOGO_URL,'contentUrl':LOGO_URL,'width':604,'height':604,'caption':'Oleh Hebel & Co'}
          FAV='  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />\n  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />\n  <link rel="icon" href="/favicon.ico" sizes="any" />\n'
          BRAND='<img class="brand-mark" src="/assets/brand/oleh-hebel-co-logo.svg" width="24" height="24" alt="" aria-hidden="true" decoding="async" style="display:inline-block;vertical-align:middle;margin-right:8px" /><span class="brand-name">OLEH HEBEL &amp; Co</span>'

          def enrich(node):
              if isinstance(node,dict):
                  if node.get('@type')=='Organization' and node.get('@id')==ORG_ID:
                      node['logo']=dict(LOGO)
                      node.setdefault('image',{'@id':'https://superprompt.pro/#logo'})
                  if node.get('@type')=='Article':
                      pub=node.get('publisher')
                      if isinstance(pub,dict) and pub.get('@id')==ORG_ID:
                          pub.setdefault('@type','Organization')
                          pub.setdefault('name','Oleh Hebel & Co')
                          pub['logo']=dict(LOGO)
                  for v in node.values(): enrich(v)
              elif isinstance(node,list):
                  for v in node: enrich(v)

          jpat=re.compile(r'(<script\s+type=["\']application/ld\+json["\']\s*>)(.*?)(</script>)',re.I|re.S)
          def patch_jsonld(text):
              def repl(m):
                  try: data=json.loads(m.group(2).strip())
                  except Exception: return m.group(0)
                  enrich(data)
                  body=json.dumps(data,ensure_ascii=False,indent=2)
                  return m.group(1)+'\n  '+body.replace('\n','\n  ')+'\n  '+m.group(3)
              return jpat.sub(repl,text)

          for path in [p for p in Path('.').rglob('*.html') if '.github' not in p.parts]:
              text=path.read_text(encoding='utf-8')
              text=re.sub(r'\s*<link\s+rel=["\'](?:shortcut\s+)?icon["\'][^>]*?/?>','',text,flags=re.I)
              if '/favicon.svg' not in text:
                  text=text.replace('</head>',FAV+'</head>',1)
              if 'class="brand-mark"' not in text:
                  text=re.sub(r'(<a\b[^>]*class=["\'][^"\']*\bbrand\b[^"\']*["\'][^>]*>)\s*OLEH HEBEL &amp; C[oO]\s*(</a>)',lambda m:m.group(1)+BRAND+m.group(2),text,flags=re.I)
              text=patch_jsonld(text)
              path.write_text(text,encoding='utf-8')

          sp=Path('sitemap.xml')
          s=sp.read_text(encoding='utf-8')
          hp=re.compile(r'(<url>\s*<loc>https://superprompt\.pro/</loc>)(.*?)(</url>)',re.S)
          def home(m):
              mid=re.sub(r'<lastmod>[^<]+</lastmod>','<lastmod>2026-09-09</lastmod>',m.group(2),count=1)
              if LOGO_URL not in mid:
                  mid+='\n    <image:image><image:loc>'+LOGO_URL+'</image:loc></image:image>\n  '
              return m.group(1)+mid+m.group(3)
          sp.write_text(hp.sub(home,s,count=1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-brand-logo.yml
          git add -A
          git commit -m 'Add canonical brand logo favicon and Organization schema'
          git push origin HEAD:index.html
