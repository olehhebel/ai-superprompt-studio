name: Import original logo artwork

on:
  push:
    branches: ["index.html"]
    paths:
      - ".github/workflows/import-original-logos.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index.html
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow requests numpy
      - name: Build original PNG logo assets
        shell: bash
        run: |
          cat > /tmp/import_logos.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import requests, re, html, json, sys
          from collections import deque

          OUT = Path('assets/work/concepts/original')
          OUT.mkdir(parents=True, exist_ok=True)
          SRC = Path('assets/work')

          def bbox_nonwhite(im, threshold=242):
              arr = np.asarray(im.convert('RGB'))
              mask = np.any(arr < threshold, axis=2)
              ys, xs = np.where(mask)
              if not len(xs):
                  return (0,0,im.width,im.height)
              return (int(xs.min()), int(ys.min()), int(xs.max()+1), int(ys.max()+1))

          def normalize_crop(source, box, dest, maxsize=(500,220)):
              im = Image.open(source).convert('RGB').crop(tuple(map(int, box)))
              b = bbox_nonwhite(im)
              im = im.crop(b)
              im.thumbnail(maxsize, Image.Resampling.LANCZOS)
              canvas = Image.new('RGB',(600,320),'white')
              canvas.paste(im,((600-im.width)//2,(320-im.height)//2))
              canvas.save(OUT/dest, 'PNG', optimize=True)

          # These crops come directly from the original 2022 portfolio pages already stored in the repository.
          # Only crop / scale / white padding is applied. The logo artwork itself is not redrawn.
          s = 1500/2880
          local = [
              ('tra-9.webp',(1100,500,1800,1000),'tra-logo-by-oleh-hebel.png'),
              ('yads-14.webp',(1100,500,1800,1000),'yads-logo-by-oleh-hebel.png'),
              ('smartproject-23.webp',(1100,450,1800,1050),'erp-smartproject-logo-by-oleh-hebel.png'),
              ('thrive-well-28.webp',(1500,120,2750,700),'thrive-well-logo-by-oleh-hebel.png'),
              ('maison-37.webp',(1000,450,1900,1000),'maison-logo-by-oleh-hebel.png'),
              ('muse-44.webp',(1000,450,1800,1000),'muse-logo-by-oleh-hebel.png'),
              ('autumn-hills-49.webp',(850,300,2050,1600),'autumn-hills-logo-by-oleh-hebel.png'),
          ]
          for file, box, dest in local:
              scaled = tuple(round(v*s) for v in box)
              normalize_crop(SRC/file, scaled, dest)

          # FuelUp: isolate the original white wordmark from the original photograph.
          # This is a pixel mask of the original artwork, not a recreation.
          im = Image.open(SRC/'fuelup-54.webp').convert('RGB')
          box = tuple(round(v*s) for v in (950,1450,2050,2750))
          crop = im.crop(box)
          arr = np.asarray(crop)
          mask = (arr[:,:,0]>235)&(arr[:,:,1]>235)&(arr[:,:,2]>235)
          h,w = mask.shape
          seen = np.zeros((h,w), dtype=bool)
          keep = np.zeros((h,w), dtype=bool)
          for yy in range(h):
              for xx in range(w):
                  if not mask[yy,xx] or seen[yy,xx]:
                      continue
                  q=[(yy,xx)]; seen[yy,xx]=True; pts=[]
                  for y,x in q:
                      pts.append((y,x))
                      for dy,dx in ((1,0),(-1,0),(0,1),(0,-1)):
                          ny,nx=y+dy,x+dx
                          if 0<=ny<h and 0<=nx<w and mask[ny,nx] and not seen[ny,nx]:
                              seen[ny,nx]=True; q.append((ny,nx))
                  if len(pts) > 130:
                      for y,x in pts: keep[y,x]=True
          ys,xs=np.where(keep)
          if len(xs):
              x0,y0,x1,y1=int(xs.min()),int(ys.min()),int(xs.max()+1),int(ys.max()+1)
              out=np.full((h,w,3),255,np.uint8); out[keep]=0
              logo=Image.fromarray(out).crop((x0,y0,x1,y1))
              logo.thumbnail((500,240), Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(600,320),'white')
              canvas.paste(logo,((600-logo.width)//2,(320-logo.height)//2))
              canvas.save(OUT/'fuelup-logo-by-oleh-hebel.png','PNG',optimize=True)

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'})

          def download(url):
              r=session.get(url,timeout=40,allow_redirects=True,headers={'Referer':url})
              r.raise_for_status()
              from io import BytesIO
              return Image.open(BytesIO(r.content)).convert('RGB'), r.url

          def normalize_remote(url, dest):
              im, final = download(url)
              # Preserve the original submission. Only trim a near-uniform light border when present,
              # then scale proportionally and place it on a white 600x320 canvas.
              arr=np.asarray(im)
              edges=np.concatenate([arr[0,:,:],arr[-1,:,:],arr[:,0,:],arr[:,-1,:]],axis=0)
              bg=np.median(edges,axis=0)
              spread=float(np.mean(np.std(edges.astype(float),axis=0)))
              if spread < 28:
                  dist=np.sqrt(np.sum((arr.astype(float)-bg.reshape(1,1,3))**2,axis=2))
                  mask=dist>24
                  ys,xs=np.where(mask)
                  if len(xs)>50:
                      pad=max(6,round(min(im.size)*.025))
                      b=(max(0,int(xs.min())-pad),max(0,int(ys.min())-pad),min(im.width,int(xs.max()+1)+pad),min(im.height,int(ys.max()+1)+pad))
                      im=im.crop(b)
              im.thumbnail((530,250),Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(600,320),'white')
              canvas.paste(im,((600-im.width)//2,(320-im.height)//2))
              canvas.save(OUT/dest,'PNG',optimize=True)
              return final

          remote = {
            # Exact original public portfolio / contest submission image URLs.
            'terra-logo-by-oleh-hebel.png':'https://cdn.freelance.ru/download/3857263/pic2816090.jpg',
            'tivona-logo-by-oleh-hebel.png':'https://cdn.dribbble.com/userupload/36706773/file/original-7798c7e0007efd547ede4241eeadac10.jpg?resize=1200x0',
            'atomline-logo-concept-by-oleh-hebel.png':'https://freelance.boutique/contest/file/406625/1',
            'arion-logo-concept-by-oleh-hebel.png':'https://freelance.boutique/contest/file/85820/1',
            'ciucas-rescue-race-logo-by-oleh-hebel.png':'https://images-platform.99static.com/eSMZUFJ47mbG4p3xYlB_l6TH6iM%3D/0x1374%3A1440x2814/500x500/top/smart/99designs-contests-attachments/138/138862/attachment_138862605',
            'cochelux-logo-concept-by-oleh-hebel.png':'https://images-platform.99static.com/CFJKFxSunwcI3H-S0aaSEPEEAsM%3D/0x0%3A1509x1509/500x500/top/smart/99designs-contests-attachments/128/128567/attachment_128567111',
          }
          manifest=[]
          for dest,url in remote.items():
              try:
                  final=normalize_remote(url,dest)
                  manifest.append({'file':dest,'source':final,'ok':True})
              except Exception as e:
                  manifest.append({'file':dest,'source':url,'ok':False,'error':str(e)})

          # Dribbble: resolve the original upload URL from the real shot page/search HTML.
          def dribbble_original(shot_url, query):
              candidates=[]
              for u in (shot_url, f'https://dribbble.com/search/{query}'):
                  try:
                      txt=session.get(u,timeout=40).text
                      found=re.findall(r'https:\\/\\/cdn\\.dribbble\\.com\\/userupload\\/[^"\\\\<> ]+',txt)
                      found += re.findall(r'https://cdn\.dribbble\.com/userupload/[^"\\<> ]+',txt)
                      for x in found:
                          x=html.unescape(x.replace('\\/','/'))
                          if x not in candidates: candidates.append(x)
                  except Exception:
                      pass
              originals=[u for u in candidates if '/file/original-' in u]
              return (originals or candidates)[0] if (originals or candidates) else None

          for name, shot, query, dest in [
              ('Lushnikova','https://dribbble.com/shots/17859837-Lushnikova-logo','lushnikova','lushnikova-logo-by-oleh-hebel.png'),
          ]:
              try:
                  u=dribbble_original(shot,query)
                  if not u: raise RuntimeError('original upload URL not found')
                  final=normalize_remote(u,dest)
                  manifest.append({'file':dest,'source':final,'ok':True})
              except Exception as e:
                  manifest.append({'file':dest,'source':shot,'ok':False,'error':str(e)})

          (OUT/'sources.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
          python /tmp/import_logos.py
      - name: Commit original PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/work/concepts/original
          if git diff --cached --quiet; then
            echo "No logo asset changes"
            exit 0
          fi
          git commit -m "Import original logo artwork as PNG [skip ci]"
          git push origin HEAD:index.html
