<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>AI UX Trust Checklist | Free Human–AI Audit</title><meta content="Audit AI product trust across scope, progress, approval, evidence, intervention, recovery and human handoff. Free checklist, no signup." name="description"/><meta content="index,follow" name="robots"/><link href="/service-page.css" rel="stylesheet"/><style>.check{display:grid;gap:14px;max-width:900px}.check label{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:10px}.result{margin-top:28px;font-size:24px;color:var(--blue)}</style>
<meta content="uk_UA" property="og:locale:alternate"/><link href="/services-offer.css" rel="stylesheet"/><link href="https://olehhebel.top/tools/ai-ux-trust-checklist" hreflang="en" rel="alternate"/><link href="https://olehhebel.top/uk/tools/ai-ux-trust-checklist.html" hreflang="uk" rel="alternate"/><link href="https://olehhebel.top/tools/ai-ux-trust-checklist" hreflang="x-default" rel="alternate"/><link href="https://olehhebel.top/tools/ai-ux-trust-checklist" rel="canonical"/><meta content="en_US" property="og:locale"/><meta content="https://olehhebel.top/tools/ai-ux-trust-checklist" property="og:url"/></head><body><header class="service-header"><a class="brand" href="/">OLEH HEBEL &amp; Co</a><nav class="service-nav"><a href="/tools">Tools</a><a href="/ai-agent-ux-design">Human–AI UX</a></nav><nav aria-label="Site language" class="language-switch"><a aria-current="page" href="/tools/ai-ux-trust-checklist" hreflang="en" lang="en">EN</a><a href="/uk/tools/ai-ux-trust-checklist.html" hreflang="uk" lang="uk">УКР</a></nav></header><main><section class="service-hero"><div class="hero-inner"><p class="eyebrow">FREE HUMAN–AI UX AUDIT</p><h1>Can users tell what the AI will do, what it did and how to recover?</h1><p class="hero-lead">Trust is not a promise. It is a set of interaction mechanisms placed at the moments where uncertainty and consequence appear.</p></div></section><section class="service-section"><div class="section-inner"><div class="check" id="checks"><label><input type="checkbox"/>The user can see the scope of an AI action before consequential execution.</label><label><input type="checkbox"/>Progress communicates meaningful state, not only a spinner.</label><label><input type="checkbox"/>The product separates suggestions from actions already taken.</label><label><input type="checkbox"/>Approval is required where consequence or irreversibility is high.</label><label><input type="checkbox"/>Results show enough evidence or source context for the user to judge them.</label><label><input type="checkbox"/>Uncertainty is represented without fake precision.</label><label><input type="checkbox"/>Undo, retry, correction or escalation exists when the AI is wrong.</label><label><input type="checkbox"/>Partial completion is distinguishable from success.</label><label><input type="checkbox"/>Users know when automation stops and human input is required.</label><label><input type="checkbox"/>A human handoff preserves the relevant task context.</label></div><div aria-live="polite" class="result" id="result"></div></div></section></main><script>const b=[...document.querySelectorAll('input')],r=document.getElementById('result');function s(){const n=b.filter(x=>x.checked).length;r.textContent=n>=9?'9–10 / 10 — strong interaction trust layer':n>=6?'6–8 / 10 — usable, but trust gaps remain':'0–5 / 10 — users are carrying too much uncertainty themselves'}b.forEach(x=>x.addEventListener('change',s));s()</script></body></html>
