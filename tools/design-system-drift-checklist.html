<meta content="uk_UA" property="og:locale:alternate"/><link href="/services-offer.css" rel="stylesheet"/><link href="https://olehhebel.top/tools/design-system-drift-checklist" hreflang="en" rel="alternate"/><link href="https://olehhebel.top/uk/tools/design-system-drift-checklist.html" hreflang="uk" rel="alternate"/><link href="https://olehhebel.top/tools/design-system-drift-checklist" hreflang="x-default" rel="alternate"/><link href="https://olehhebel.top/tools/design-system-drift-checklist" rel="canonical"/><meta content="en_US" property="og:locale"/><meta content="https://olehhebel.top/tools/design-system-drift-checklist" property="og:url"/></head><body><header class="service-header"><a class="brand" href="/">OLEH HEBEL &amp; Co</a><nav class="service-nav"><a href="/tools">Tools</a><a href="/agent-ready-design-system">Agent-Ready System</a></nav><nav aria-label="Site language" class="language-switch"><a aria-current="page" href="/tools/design-system-drift-checklist" hreflang="en" lang="en">EN</a><a href="/uk/tools/design-system-drift-checklist.html" hreflang="uk" lang="uk">УКР</a></nav></header><main><section class="service-hero"><div class="hero-inner"><p class="eyebrow">FREE SYSTEM AUDIT</p><h1>Does your design system still exist in one place?</h1><p class="hero-lead">Check the alignment between Figma, shipped code and the rules your coding agents receive.</p></div></section><section class="service-section"><div class="section-inner"><div class="check" id="checks"><label><input type="checkbox"/>Canonical production components are mapped to design components.</label><label><input type="checkbox"/>Tokens use semantic names rather than screen-specific values.</label><label><input type="checkbox"/>Interactive states are defined, not inferred per implementation.</label><label><input type="checkbox"/>Responsive behavior is documented as rules, not screenshots.</label><label><input type="checkbox"/>Deprecated components are clearly marked in both design and code.</label><label><input type="checkbox"/>Coding-agent instructions point to canonical components and tokens.</label><label><input type="checkbox"/>New generated UI is checked for duplicate patterns before merge.</label><label><input type="checkbox"/>Figma and production use compatible naming for major variants.</label><label><input type="checkbox"/>Accessibility constraints are part of component rules.</label><label><input type="checkbox"/>The team can identify one current source of truth for each UI rule.</label></div><div aria-live="polite" class="result" id="result"></div></div></section></main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')],r=document.getElementById('result');function score(){const n=boxes.filter(x=>x.checked).length;r.textContent=n>=9?'9–10 / 10 — aligned system':n>=6?'6–8 / 10 — drift is forming':'0–5 / 10 — system-level drift; consolidate before scaling output'}boxes.forEach(x=>x.addEventListener('change',score));score()</script></body></html>
