<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Debt Calculator | Free SaaS UX Tool</title><meta name="description" content="Estimate how repeated UI inconsistencies compound into design debt across screens, components and teams. Free, no signup."><meta name="robots" content="index,follow"><link rel="canonical" href="https://superprompt.pro/tools/design-debt-calculator"><link rel="stylesheet" href="/service-page.css"><style>.tool{max-width:860px;margin:0 auto}.tool label{display:block;margin:24px 0 8px}.tool input{width:100%;padding:16px;border:1px solid var(--line);border-radius:10px;font:inherit}.result{margin-top:32px;padding:28px;border:1px solid var(--line);border-radius:12px}.score{font-size:42px;color:var(--blue);display:block;margin-bottom:8px}</style><script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Design Debt Calculator","applicationCategory":"BusinessApplication","operatingSystem":"Web","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"url":"https://superprompt.pro/tools/design-debt-calculator"}</script></head><body><header class="service-header"><a class="brand" href="/">OLEH HEBEL &amp; Co</a><nav class="service-nav"><a href="/tools">Tools</a><a href="/design-debt-cleanup">Design Debt Cleanup</a></nav></header><main><section class="service-hero"><div class="hero-inner"><p class="eyebrow">FREE DESIGN DEBT TOOL</p><h1>How much repeated inconsistency is your product carrying?</h1><p class="hero-lead">This is a prioritization model, not a financial forecast. It estimates recurrence pressure: how many places a weak rule can force the team to make the same decision again.</p></div></section><section class="service-section"><div class="section-inner tool"><label for="screens">Screens or major views</label><input id="screens" type="number" min="1" value="24"><label for="dup">Known duplicate / near-duplicate patterns</label><input id="dup" type="number" min="0" value="12"><label for="states">Components with missing or inconsistent states</label><input id="states" type="number" min="0" value="8"><label for="teams">People or agents regularly shipping UI</label><input id="teams" type="number" min="1" value="4"><div class="result" aria-live="polite"><span class="score" id="score"></span><b id="band"></b><p id="advice"></p></div></div></section></main><script>const q=id=>document.getElementById(id);function calc(){const s=+q('screens').value||0,d=+q('dup').value||0,st=+q('states').value||0,t=+q('teams').value||1;const n=Math.round((d*2+st*1.5)*(1+Math.log2(Math.max(1,t)))*Math.min(2,Math.max(.5,s/24)));q('score').textContent=n+' recurrence points';if(n<25){q('band').textContent='Contained';q('advice').textContent='Fix locally as work touches these areas; a large cleanup is unlikely to pay back yet.'}else if(n<60){q('band').textContent='Compounding';q('advice').textContent='Consolidate the highest-frequency patterns and complete their states before adding more variants.'}else{q('band').textContent='System-level debt';q('advice').textContent='Stop creating local fixes. Inventory repeated patterns, choose canonical components and align design and code rules.'}}['screens','dup','states','teams'].forEach(id=>q(id).addEventListener('input',calc));calc()</script></body></html>
