<html lang="uk"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Перевірка розбіжностей дизайн-системи | Олег Гебель</title><meta content="Перевір відповідність між Figma, реальним кодом і правилами для AI-агентів." name="description"/><meta content="index,follow" name="robots"/><link href="/service-page.css" rel="stylesheet"/><style>.check{display:grid;gap:14px;max-width:900px}.check label{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:10px}.result{margin-top:28px;font-size:24px;color:var(--blue)}</style>
<meta content="uk_UA" property="og:locale:alternate"/><link href="/services-offer.css" rel="stylesheet"/><link href="https://olehhebel.top/tools/design-system-drift-checklist" hreflang="en" rel="alternate"/><link href="https://olehhebel.top/uk/tools/design-system-drift-checklist.html" hreflang="uk" rel="alternate"/><link href="https://olehhebel.top/tools/design-system-drift-checklist" hreflang="x-default" rel="alternate"/><link href="https://olehhebel.top/uk/tools/design-system-drift-checklist.html" rel="canonical"/><meta content="uk_UA" property="og:locale"/><meta content="en_US" property="og:locale:alternate"/><meta content="https://olehhebel.top/uk/tools/design-system-drift-checklist.html" property="og:url"/></head><body><header class="service-header"><a class="brand" href="/uk/">OLEH HEBEL &amp; Co</a><nav class="service-nav"><a href="/uk/tools.html">Інструменти</a><a href="/uk/agent-ready-design-system.html">Система для AI-агентів</a></nav><nav aria-label="Мова сайту" class="language-switch"><a href="/tools/design-system-drift-checklist" hreflang="en" lang="en">EN</a><a aria-current="page" href="/uk/tools/design-system-drift-checklist.html" hreflang="uk" lang="uk">УКР</a></nav></header><main><section class="service-hero"><div class="hero-inner"><p class="eyebrow">БЕЗКОШТОВНИЙ АУДИТ СИСТЕМИ</p><h1>Чи зберегла твоя дизайн-система єдине джерело істини?</h1><p class="hero-lead">Перевір відповідність між Figma, реальним кодом і правилами для AI-агентів.</p></div></section><section class="service-section"><div class="section-inner"><div class="check" id="checks"><label><input type="checkbox"/>Основні компоненти коду зіставлені з компонентами дизайну.</label><label><input type="checkbox"/>Токени мають семантичні назви, а не значення для окремих екранів.</label><label><input type="checkbox"/>Стани взаємодії визначені й спільні для реалізацій.</label><label><input type="checkbox"/>Адаптивність описана правилами, а не лише скриншотами.</label><label><input type="checkbox"/>Застарілі компоненти чітко позначені в дизайні та коді.</label><label><input type="checkbox"/>Інструкції агентів посилаються на основні компоненти й токени.</label><label><input type="checkbox"/>Новий згенерований UI перевіряють на дублікати до злиття змін.</label><label><input type="checkbox"/>Назви основних варіантів узгоджені між Figma та кодом.</label><label><input type="checkbox"/>Вимоги доступності включені до правил компонентів.</label><label><input type="checkbox"/>Команда може вказати актуальне джерело кожного правила UI.</label></div><div aria-live="polite" class="result" id="result"></div></div></section></main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')],r=document.getElementById('result');function score(){const n=boxes.filter(x=>x.checked).length;r.textContent=n>=9?'9–10 / 10 — узгоджена система':n>=6?'6–8 / 10 — з’являються розбіжності':'0–5 / 10 — системні розбіжності; узгодь правила перед масштабуванням'}boxes.forEach(x=>x.addEventListener('change',score));score()</script></body></html>
